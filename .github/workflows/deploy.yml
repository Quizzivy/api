name: Deploy

# Merging release/* into main is what ships the API. The web deploys from
# Quizzivy/web, after this (D-082). This runs AFTER CI concludes on
# main rather than on the push itself, so a merge that breaks something is not
# deployed while its own test run is still red.
#
# It is a separate workflow, not a job inside CI, for one reason worth stating:
# a deploy that fails for an infrastructure reason -- an expired key, the box
# unreachable for a minute -- can be re-run on its own from workflow_dispatch, without
# paying for twenty minutes of tests that already passed on the same commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy in flight. A cancelled deploy can leave the box
# mid-rollout, and a cancelled migration step can leave migrations half applied
# -- both far worse than one queued run waiting its turn.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Where the health checks after a rollout ask the API whether it is up.
  API_ORIGIN: https://api.quizzivy.com

jobs:
  # The commit CI validated, resolved once so every job deploys the same thing.
  #
  # workflow_run does NOT check out the triggering commit by default -- it
  # checks out the default branch's tip. On a quiet repo those are the same
  # commit and the difference never shows; on a busy afternoon it silently
  # deploys something CI never saw.
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    # event == 'push': the branch filter above matches the run's HEAD branch,
    # and the back-merge pull request from main to develop has main as its
    # head. Without this, its CI run deployed the same commit a second time.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      api: ${{ steps.pick.outputs.api }}
      host: ${{ steps.pick.outputs.host }}
    steps:
      # A CI run that is no longer the tip of main deploys nothing. Re-running
      # an old run to green completes it again, and without this check that
      # would put an earlier release back into production.
      - id: pick
        env:
          TRIGGER: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          API_HOST: ${{ vars.API_HOST }}
        run: |
          # Where the API runs: the repository variable API_HOST, `vps`.
          # Unset deploys nothing: this repository took over production only
          # when the owner set it (repo split, GĐ 6). Anything else stops here
          # rather than deploying nowhere, or to the wrong place.
          host="${API_HOST:-}"
          api=true
          case "$host" in
            vps) ;;
            "") echo "::notice::API_HOST is not set, so nothing is deployed"; api=false ;;
            *) echo "::error::API_HOST must be vps, not '$host'"; exit 1 ;;
          esac
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ "$TRIGGER" = workflow_run ] && [ "$api" = true ]; then
            tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            if [ "$sha" != "$tip" ]; then
              echo "::notice::$sha is not the tip of main ($tip); nothing is deployed"
              api=false
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "Deploying the API at $sha (api=$api on ${host:-nowhere})"

  # ------------------------------------------------------------------- api
  # The release on the VPS (infra: github.com/Quizzivy/infra, docs/vps.md).
  # The image is built here and pushed to ghcr.io; the box pulls it, runs the
  # migrations as a one-shot container, replaces api and worker, and rolls back
  # on a failed health check. The key below can run `deploy <sha>` and
  # nothing else: the box forces its command, so a leaked key cannot get a shell.
  #
  # Needs: secrets VPS_HOST, VPS_SSH_KEY (private half of the deploy key) and
  # VPS_KNOWN_HOSTS (the box's host key line, from `ssh-keyscan -t ed25519`).
  # The box's compose.env must name this image repository in API_IMAGE_REPO and
  # `docker login ghcr.io` there must hold a token with read:packages.
  api:
    name: API → VPS
    needs: resolve
    if: needs.resolve.outputs.api == 'true' && needs.resolve.outputs.host == 'vps'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Check the credentials are present
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=
          [ -n "$VPS_HOST" ]        || missing="$missing VPS_HOST"
          [ -n "$VPS_SSH_KEY" ]     || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_KNOWN_HOSTS" ] || missing="$missing VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::secrets not set:$missing (see docs/setup/deploy.md)"
            exit 1
          fi

      # Tagged with the commit, so a deploy names exactly one build. A re-run
      # of the same commit finds the image already pushed and builds nothing.
      #
      # push-image.sh builds in a BuildKit builder of its own and pushes from
      # there. Do not turn it back into `docker build` and `docker push`: from
      # the runner's own store the push mounts the distroless layers out of an
      # image the runner ships with, and ghcr.io then refuses the manifest
      # with "denied". That is how the first deploy to the VPS failed; the
      # script's header has the whole account.
      - name: Build and push the image
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/quizzivy-api:$SHA"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "$image is already published"
          else
            scripts/ci/push-image.sh "$image" .
          fi
          echo "image: $image" >> "$GITHUB_STEP_SUMMARY"

      # StrictHostKeyChecking stays on: the host key comes from the secret, so
      # a different machine answering on that address is refused.
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The box streams the deploy log and exits with the deploy's status.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 "deploy@$VPS_HOST" deploy "$SHA"

      # The box already waited for its own /healthz; this asks through
      # Cloudflare, the path users take.
      - name: Verify the API answers
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 10 "$API_ORIGIN/healthz") && break
            echo "attempt $attempt failed; retrying in 6s"; sleep 6
          done
          echo "$body"
          echo "$body" | grep -q '"database":"ok"' || {
            echo "::error::/healthz did not report database:ok"; exit 1; }

  # ------------------------------------------------------------------- sdk
  # Once the API is live, @quizzivy/sdk moves `latest` to the exact version
  # this commit pins (api/sdk-version), so no client adopts a contract
  # production lacks (D-081, D-082 (iv)). Only from main: a dispatch from
  # another ref deploys but promotes nothing. Promote in Quizzivy/sdk is
  # idempotent and refuses a -dev version. A failed dispatch fails this job,
  # so the run shows it; the owner can then run Promote there by hand.
  sdk:
    name: Promote the SDK
    needs: [resolve, api]
    if: ${{ !cancelled() && (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main') && needs.resolve.outputs.api == 'true' && needs.api.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: api/sdk-version
          persist-credentials: false

      - name: Ask Quizzivy/sdk to promote the pinned version
        env:
          # A GitHub App installation token or a fine-grained token with
          # contents:write on Quizzivy/sdk (repository_dispatch needs it).
          TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          version=$(tr -d '[:space:]' < api/sdk-version)
          # Only a release becomes latest (D-081). Promote in Quizzivy/sdk refuses
          # anything else after a 204 here, which would leave this run green.
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=SDK promote::api/sdk-version on main is '$version', not a release X.Y.Z: pin the release the owner tagged in Quizzivy/sdk."
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error title=SDK promote::SDK_DISPATCH_TOKEN is not set: run Actions -> Promote in Quizzivy/sdk with $version by hand."
            exit 1
          fi
          payload=$(jq -nc --arg v "$version" --arg s "Quizzivy/api@$SHA" '{event_type: "promote-sdk", client_payload: {version: $v, source: $s}}')
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Quizzivy/sdk/dispatches -d "$payload")
          if [ "$status" != 204 ]; then
            echo "::error title=SDK promote::the dispatch answered $status: run Actions -> Promote in Quizzivy/sdk with $version by hand."
            cat response.txt
            exit 1
          fi
          echo "Asked Quizzivy/sdk to promote @quizzivy/sdk@$version to latest." | tee -a "$GITHUB_STEP_SUMMARY"
